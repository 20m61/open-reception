rules:
  - id: next-public-secret
    languages: [typescript, javascript]
    severity: ERROR
    message: >-
      NEXT_PUBLIC_ 接頭辞の env は **フロント bundle に埋め込まれて配布される**。
      機密を示す名前 (SECRET / PRIVATE / PASSWORD / CREDENTIAL / _KEY / TOKEN) を
      付けてはいけない。サーバ専用 env で扱い、必要ならサーバ経由で最小限だけ返すこと。
      正本: .claude/rules/pii-secret-minimization.md（#105 / #19）
    patterns:
      - pattern-either:
          - pattern: process.env.$NAME
          - pattern: process.env["$NAME"]
      - metavariable-regex:
          metavariable: $NAME
          regex: ^NEXT_PUBLIC_.*(SECRET|PRIVATE|PASSWORD|CREDENTIAL|_KEY|TOKEN)
