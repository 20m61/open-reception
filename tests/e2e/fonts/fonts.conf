<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<!--
  VRT の撮影フォントの許可リスト (#1289)。linux の chromium にだけ FONTCONFIG_FILE で渡す
  （playwright.config.ts / tests/config/vrt-font-pin.ts）。

  linux の baseline は、`playwright install-deps` のフォント群から IPA ゴシックと Unifont を除き、
  fontconfig 既定の DejaVu を足した環境と同じ描画になる。/usr/share/fonts を丸ごと読むと、
  IPA ゴシック・Unifont（install-deps が入れる）や Noto Sans CJK・システムの Inter が日本語の
  フォールバック先と合成ボールドを変え、VRT が落ちる。
  ここに足すときは、baseline を撮り直すのと同じ重さの変更として扱う（docs/quality-gate.md）。
-->
<fontconfig>
  <dir>/usr/share/fonts/truetype/wqy</dir>
  <dir>/usr/share/fonts/truetype/dejavu</dir>
  <dir>/usr/share/fonts/truetype/liberation</dir>
  <dir>/usr/share/fonts/truetype/freefont</dir>
  <dir>/usr/share/fonts/opentype/tlwg</dir>
  <dir>/usr/share/fonts/truetype/noto</dir>
  <cachedir prefix="xdg">fontconfig</cachedir>
  <!-- ヒンティング・合成ボールドなどの描画規則は system のものを使う（外すと全件落ちる。実測）。 -->
  <include ignore_missing="yes">/etc/fonts/conf.d</include>
</fontconfig>
